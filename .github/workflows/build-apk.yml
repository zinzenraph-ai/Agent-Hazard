name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Créer le fichier .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
            echo "Fichier .env créé depuis le secret ENV_FILE"
          else
            cp .env.example .env
            echo "Secret ENV_FILE absent : .env copié depuis .env.example"
          fi

      - name: Créer le debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler l'APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Hazard-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
