name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Créer le fichier .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
            echo "Fichier .env créé depuis le secret ENV_FILE"
          else
            cp .env.example .env
            echo "Secret ENV_FILE absent : .env copié depuis .env.example"
          fi

      - name: Préparer les clés API pour BuildConfig
        run: |
          python3 <<'PY'
          from pathlib import Path

          keys = [
              "ALPHAVANTAGE_API_KEY",
              "GNEWS_API_KEY",
              "OPENROUTER_API_KEY",
              "TWELVEDATA_API_KEY",
              "GEMINI_API_KEY",
              "COINGECKO_API_KEY",
              "EXCHANGE_API_KEY",
              "EXCHANGE_API_SECRET",
              "FIREBASE_APPCHECK_DEBUG_TOKEN",
          ]

          env = {}
          p = Path(".env")

          if p.exists():
              for line in p.read_text(encoding="utf-8").splitlines():
                  line = line.strip().rstrip("\r")
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  k, v = line.split("=", 1)
                  env[k.strip()] = v.strip()

          def java_string_literal(value: str) -> str:
              value = (value or "").strip()
              if value == "" or value in ("''", '""'):
                  return '""'
              if len(value) >= 2 and value[0] == '"' and value[-1] == '"':
                  return value
              value = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          # Ajoute des valeurs Gradle valides pour buildConfigField()
          with open("gradle.properties", "a", encoding="utf-8") as g:
              g.write("\n# Added by GitHub Actions for BuildConfig\n")
              for k in keys:
                  g.write(f"{k}={java_string_literal(env.get(k, ''))}\n")

          # Corrige aussi .env pour éviter les clés complètement vides
          existing = set()
          lines = []

          if p.exists():
              for raw in p.read_text(encoding="utf-8").splitlines():
                  line = raw.rstrip("\r")
                  if "=" in line and not line.lstrip().startswith("#"):
                      k, v = line.split("=", 1)
                      k = k.strip()
                      if k in keys:
                          existing.add(k)
                          if v.strip() == "":
                              line = f'{k}=""'
                  lines.append(line)

          for k in keys:
              if k not in existing:
                  lines.append(f'{k}=""')

          p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("Clés BuildConfig préparées correctement")
          PY

      - name: Créer le debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler l'APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Hazard-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
