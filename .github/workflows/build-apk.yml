name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Créer le fichier .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
            echo "Fichier .env créé depuis le secret ENV_FILE"
          else
            cp .env.example .env
            echo "Secret ENV_FILE absent : .env copié depuis .env.example"
          fi

      - name: Normaliser les clés pour BuildConfig
        run: |
          python3 <<'PY'
          from pathlib import Path

          keys = [
              "ALPHAVANTAGE_API_KEY",
              "GEMINI_API_KEY",
              "GNEWS_API_KEY",
              "OPENROUTER_API_KEY",
              "TWELVEDATA_API_KEY",
              "COINGECKO_API_KEY",
              "EXCHANGE_API_KEY",
              "EXCHANGE_API_SECRET",
              "FIREBASE_APPCHECK_DEBUG_TOKEN",
          ]

          env_path = Path(".env")
          lines = env_path.read_text(encoding="utf-8").splitlines() if env_path.exists() else []

          def quote_java_string(value: str) -> str:
              value = (value or "").strip()

              if len(value) >= 2 and value[0] == '"' and value[-1] == '"':
                  value = value[1:-1]

              if len(value) >= 2 and value[0] == "'" and value[-1] == "'":
                  value = value[1:-1]

              value = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          found = set()
          new_lines = []

          for raw in lines:
              line = raw.rstrip("\r")

              if not line.strip() or line.lstrip().startswith("#") or "=" not in line:
                  new_lines.append(line)
                  continue

              key, value = line.split("=", 1)
              key = key.strip()

              if key in keys:
                  found.add(key)
                  new_lines.append(f"{key}={quote_java_string(value)}")
              else:
                  new_lines.append(line)

          for key in keys:
              if key not in found:
                  new_lines.append(f'{key}=""')

          env_path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")

          print("BuildConfig OK : clés normalisées sans afficher les valeurs")
          PY

      - name: Créer le debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler l'APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Hazard-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
