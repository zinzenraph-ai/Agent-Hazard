name: Générer APK Android

on:
  push:
    branches: ["main", "principal", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler l'application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configurer le chemin du SDK
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Compiler l'APK debug
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: application-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
